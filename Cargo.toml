[package]
name = "osa_mailer"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
app-path = { path = "app_path" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
crc = "3"
anyhow = "1"
log = "0.4"
# chrono = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "serde",
] } # Handling CVE: RUSTSEC-2020-0071
walkdir = "2.3.2"
tera = "1"
handlebars = "6"
liquid = "0.26" # 0.26.x is the newest stable series (0.27+ is prerelease-only)
regex = "1"
path-slash = "0.2"
strum = "0.27"
strum_macros = "0.27"
enum-iterator = "1"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
infer = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time", "env-filter", "tracing-log"] }

[dev-dependencies]
base64 = "0.22"

[profile.release]
panic = 'abort'
codegen-units = 1
incremental = true
lto = true
opt-level = 'z'    # Optimize for size
